<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vc-title vc-desc">
  <title id="vc-title">Six linked stages from orchard to market</title>
  <desc id="vc-desc">Flat illustration showing six connected icons in a row: orchard, collection crate, cold-chain truck, processing unit, certified product jar, and market stall, joined by a single line to show one connected value chain.</desc>

  <line x1="90" y1="120" x2="1110" y2="120" stroke="#ffd865" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round"/>

  <g transform="translate(50,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <rect x="37" y="46" width="6" height="26" fill="#5a3a22"/>
    <ellipse cx="40" cy="30" rx="26" ry="20" fill="#4a9c56"/>
    <circle cx="28" cy="30" r="4" fill="#ffb51b"/>
    <circle cx="48" cy="24" r="4" fill="#ffb51b"/>
    <circle cx="52" cy="38" r="4" fill="#ffb51b"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">ORCHARD</text>
  </g>

  <g transform="translate(240,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <path d="M18 30 L62 30 L56 62 L24 62 Z" fill="none" stroke="#4a9c56" stroke-width="3"/>
    <path d="M18 30 L24 62 M62 30 L56 62 M30 30 L33 62 M50 30 L47 62" stroke="#4a9c56" stroke-width="2"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">COLLECTION</text>
  </g>

  <g transform="translate(430,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <rect x="14" y="30" width="34" height="22" rx="2" fill="#4a9c56"/>
    <path d="M48 34 L62 34 L66 44 L66 52 L48 52 Z" fill="#4a9c56"/>
    <rect x="52" y="38" width="10" height="8" fill="#0f5432"/>
    <circle cx="24" cy="54" r="5" fill="#0f5432" stroke="#ffd865" stroke-width="1.5"/>
    <circle cx="56" cy="54" r="5" fill="#0f5432" stroke="#ffd865" stroke-width="1.5"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">COLD CHAIN</text>
  </g>

  <g transform="translate(620,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <rect x="20" y="32" width="40" height="28" fill="#4a9c56"/>
    <rect x="26" y="20" width="8" height="14" fill="#4a9c56"/>
    <rect x="46" y="20" width="8" height="14" fill="#4a9c56"/>
    <rect x="30" y="42" width="20" height="18" fill="#0f5432"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">PROCESSING</text>
  </g>

  <g transform="translate(810,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <path d="M26 26 L54 26 L54 34 L58 34 L58 62 L22 62 L22 34 L26 34 Z" fill="#4a9c56"/>
    <rect x="22" y="42" width="36" height="8" fill="#0f5432"/>
    <circle cx="40" cy="20" r="6" fill="none" stroke="#ffd865" stroke-width="2"/>
    <path d="M37 20 L39 22 L43 17" fill="none" stroke="#ffd865" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">CERTIFIED PRODUCT</text>
  </g>

  <g transform="translate(1000,50)">
    <circle cx="40" cy="40" r="40" fill="#0f5432"/>
    <path d="M16 28 L64 28 L60 40 L20 40 Z" fill="#4a9c56"/>
    <rect x="20" y="40" width="40" height="24" fill="#4a9c56"/>
    <path d="M20 40 L20 28 M60 40 L60 28 M32 40 L32 28 M48 40 L48 28" stroke="#0f5432" stroke-width="2"/>
    <rect x="30" y="48" width="20" height="16" fill="#0f5432"/>
    <text x="40" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#ffd865">MARKET</text>
  </g>
</svg>
